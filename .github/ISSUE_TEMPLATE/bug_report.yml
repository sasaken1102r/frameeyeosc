name: Bug report / 不具合の報告
description: Something doesn't work as expected. / 思ったとおりに動かないとき
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or Japanese is fine. / 報告ありがとう！英語でも日本語でも大丈夫です。
        Logs may contain IP addresses on your home network. Feel free to replace them with `x.x.x.x`.
        ログには家のネットワークの IP アドレスが入ることがあります。気になるときは `x.x.x.x` などに書き換えてください。
  - type: textarea
    id: what
    attributes:
      label: What happened / 何が起きたか
      description: What you did, what you expected, and what happened instead (a screenshot helps). / 何をしたら、どうなるはずが、どうなったか（スクリーンショットがあると助かります）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版
      description: Shown on the panel's Advanced › Version, or run `~/.local/bin/frameeyeosc-panel --version` on the Frame. / パネルの「詳細 › バージョン」、または Frame で `~/.local/bin/frameeyeosc-panel --version`
      placeholder: "0.10.1"
    validations:
      required: true
  - type: dropdown
    id: steamos_channel
    attributes:
      label: SteamOS update channel / SteamOS の更新チャンネル
      options:
        - Stable / 安定版
        - Beta / ベータ
        - Other / その他
        - Not sure / わからない
  - type: input
    id: steamos_version
    attributes:
      label: SteamOS version / SteamOS の版
      description: Run `grep VERSION_ID /etc/os-release` on the Frame. / Frame で `grep VERSION_ID /etc/os-release` を実行すると出ます
      placeholder: "0.4.5"
  - type: dropdown
    id: output
    attributes:
      label: Output / 送り先
      options:
        - VRChat directly / VRChat に直接
        - VRCFaceTracking (LiveLink)
        - VRCFaceTracking (FrameEyeOSC)
        - Not sure / わからない
  - type: dropdown
    id: connection
    attributes:
      label: How the Frame connects to the PC / Frame と PC のつなぎ方
      options:
        - Steam Link with the included wireless adapter / 付属の無線アダプターで Steam Link
        - Steam Link over home Wi-Fi / 家の Wi-Fi で Steam Link
        - Other / その他
        - Not sure / わからない
  - type: dropdown
    id: eyewear
    attributes:
      label: Glasses / 眼鏡
      description: What you wear in the Frame. Insert lenses and glasses can change what the eye cameras see. / Frame の中で着けているもの。インサートレンズや眼鏡で、目のカメラの見え方が変わることがあります
      options:
        - Nothing / なし
        - Insert lenses / インサートレンズ
        - Glasses / 眼鏡
        - Contact lenses / コンタクトレンズ
  - type: textarea
    id: logs
    attributes:
      label: Logs / ログ
      description: |
        Run this on the Frame (Desktop Mode terminal or ssh) soon after the problem, and paste the output.
        問題が起きたあとすぐに Frame で（デスクトップモードの端末か ssh で）次を実行して、出てきた内容を貼ってください。
        `journalctl --user -u frameeyeosc -u frameeyeosc-panel --since "1 hour ago" --no-pager`
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else / そのほか
      description: |
        A screenshot of the panel's Advanced › Having trouble › Diagnostics page helps. For problems with the eyes, record them with Advanced › Debug tools › Eye log › Record while it happens, then zip and attach the new files in `~/.local/share/frameeyeosc/recordings/` and `~/eyecam/drift/` (numbers only, no camera pictures). Settings you changed (`~/.config/frameeyeosc/config.json`) help too.
        パネルの「詳細 › 困ったとき › 診断」の画面のスクショがあると助かります。目の動きのことなら、起きているあいだに「詳細 › 調べる道具 › 目のログ」の「記録する」で記録して、`~/.local/share/frameeyeosc/recordings/` と `~/eyecam/drift/` にできたファイルを zip にして添付してください（数字だけで、カメラの映像は入っていません）。変えた設定（`~/.config/frameeyeosc/config.json`）もあると助かります。
