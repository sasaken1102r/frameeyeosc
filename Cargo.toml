[package]
name = "frameeyeosc"
version = "0.7.9"
edition = "2024"
license = "MIT"
description = "Sends Steam Frame eye tracking (gaze and eyelids) to VRChat over OSC"
repository = "https://github.com/sasaken1102r/frameeyeosc"

[profile.release]
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for the tests, which check the OSC encoder (src/osc.rs) byte for byte against it
[dev-dependencies]
rosc = "0.11"
