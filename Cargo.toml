[package]
name = "frameeyeosc"
version = "0.7.8"
edition = "2024"
license = "MIT"
description = "Sends Steam Frame eye tracking (gaze and eyelids) to VRChat over OSC"
repository = "https://github.com/sasaken1102r/frameeyeosc"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rosc = "0.11"
